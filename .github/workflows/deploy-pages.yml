name: Deploy CyberLex Lab to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax checks
        run: |
          node --check js/app.js
          node --check js/scenario-engine.js
          node --check js/scoring-engine.js
          node --check js/progress-engine.js
          node --check js/evidence-engine.js
          node --check js/legal-engine.js
          node --check js/certificate-engine.js
          node --check js/instructor-mode.js
      - name: Data/package tests
        run: node tests/package.test.mjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
